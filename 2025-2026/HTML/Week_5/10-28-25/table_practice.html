<!DOCTYPE html>
<html>
    <head>
        <title>Table Practice</title>
        <style>
            table, th, td {
                border: 1px solid black;
                margin-top: 20px;
            }
            td, th {
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Table practice</h1>

        <table>
            <tr>
                <th>Heading A</th>
                <th>Heading B</th>
                <th>Heading C</th>
            </tr>
            <tr>
                <td>Coffee and pastry</td>
                <td>Pizza</td>
                <td>More Pizza</td>
            </tr>
        </table>
        <table>
            <tr>
                <th>X</th>
                <th>O</th>
                <th>O</th>
            </tr>
            <tr>
                <th>O</th>
                <th>X</th>
                <th>O</th>
            </tr>
            <tr>
                <th>O</th>
                <th>O</th>
                <th>X</th>
            </tr>
        </table>

    </body>
</html>
